[package]
name = "pumpkin-essentials"
version = "0.1.0"
edition = "2021"

[profile.release] 
lto = true

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", branch = "master", package = "pumpkin" }
pumpkin-util = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", branch = "master", package = "pumpkin-util" }
pumpkin-api-macros = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", branch = "master", package = "pumpkin-api-macros" }
pumpkin-world = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", branch = "master", package = "pumpkin-world" }
pumpkin-data = { git = "https://github.com/Pumpkin-MC/Pumpkin.git", branch = "master", package = "pumpkin-data" }
pumpkin-plugin-config = { path = "../../pumpkin-plugin-config" }

async-trait = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1.46", features = ["rt-multi-thread", "fs"] }
futures = "0.3.31"
log = "0.4"
dashmap = "6.1.0"
uuid = "1.16.0"
once_cell = "1.21.1"
lazy_static = "1.5.0"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }


[patch.crates-io]
rsa = { git = "https://github.com/RustCrypto/RSA.git", branch = "master" }